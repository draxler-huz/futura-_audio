name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Generate/Build the files you want to output
      # (Replace these commands with your actual build script if needed)
      - name: Build project
        run: |
          mkdir -p output
          echo "Build finished successfully on $(date)" > output/build-results.txt

      # Step 3: Upload the output folder as a downloadable artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact          # Name of the downloadable .zip file
          path: output/                  # Path to the folder or file to download
